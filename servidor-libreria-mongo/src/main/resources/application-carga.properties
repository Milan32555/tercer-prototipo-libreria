# Perfil "carga" (solo desarrollo): habilita la mutación generarDatosCarga y, al arrancar,
# genera 1.000 libros y 5.000 ejemplares si la base tiene menos de 1.000 libros.
# Uso: mvnw spring-boot:run -Dspring-boot.run.profiles=carga
libreria.datos-iniciales.habilitado=true
libreria.carga.habilitada=true
libreria.carga.generar-al-iniciar=true
libreria.mongo.base=libreria_carga
