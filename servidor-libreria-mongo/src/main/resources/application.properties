spring.application.name=ServidorLibreriaMongo
server.port=8081

# GraphQL
spring.graphql.http.path=/graphql
spring.graphql.graphiql.enabled=true
spring.graphql.cors.allowed-origins=*
spring.graphql.cors.allowed-methods=*
spring.graphql.cors.allowed-headers=*

# MongoDB (MongoConfig). Se pueden cambiar con las variables LIBRERIA_MONGO_URI y LIBRERIA_MONGO_BASE.
libreria.mongo.uri=mongodb://localhost:27017
libreria.mongo.base=libreria

# Carga los 12 libros y 20 ejemplares de prueba si la base está vacía.
libreria.datos-iniciales.habilitado=true

# Generador de datos de carga: solo con el perfil "carga" (application-carga.properties).
libreria.carga.habilitada=false
libreria.carga.generar-al-iniciar=false

# Tiempo máximo de cada una de las 3 tareas del resumen del inventario.
libreria.tareas.tiempo-maximo-ms=5000

# Registro de operaciones por cliente (encabezado X-Cliente): true para ver también las
# consultas de revisión que el Observer de los clientes hace cada 15 s.
libreria.registro.incluir-revisiones=false

