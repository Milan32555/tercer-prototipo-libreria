# Integración continua: en cada push o pull request compila y prueba los tres proyectos.
# El servidor se prueba contra un MongoDB real que levanta el propio workflow (servicio "mongo").
name: CI

on:
  push:
  pull_request:

jobs:
  servidor:
    name: Servidor (Java · Spring Boot · MongoDB)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: servidor-libreria-mongo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Pruebas (base libreria_test en el MongoDB del workflow)
        run: ./mvnw -B verify
        env:
          LIBRERIA_MONGO_URI: mongodb://localhost:27017

  cliente-web:
    name: Cliente web (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cliente-web-react
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cliente-web-react/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas
        run: npm test
      - name: Build
        run: npm run build

  cliente-movil:
    name: Cliente móvil (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cliente-movil-flutter
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.5
          cache: true
      - run: flutter pub get
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas
        run: flutter test
